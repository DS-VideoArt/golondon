[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# קבצים תפעוליים. סקריפטי הבנייה שייכים לריפו, לא לאתר הציבורי.
[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# כותרות אבטחה לכל האתר. בלי CSP כופה, כי העמודים בנויים על סקריפטים
# מוטבעים ושבירתם מסוכנת מהתועלת. ארבע הכותרות האלה בטוחות לחלוטין.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=()"
