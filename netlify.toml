[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# קבצים תפעוליים: קבצי py נחסמים בנתיבים מפורשים בקובץ ‎_redirects,
# כי נטליפיי לא תומכת בכוכבית באמצע נתיב. docs נחסם כאן כתבנית תקינה.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# כותרות אבטחה לכל האתר. בלי CSP כופה, כי העמודים בנויים על סקריפטים
# מוטבעים ושבירתם מסוכנת מהתועלת. ארבע הכותרות האלה בטוחות לחלוטין.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=()"

# מטמון נכסים. התמונות הן רוב משקל האתר, משתנות לעיתים רחוקות וכמעט
# תמיד מוחלפות בשם קובץ חדש, ולכן שבוע במטמון בטוח וחוסך את סופת
# האימותים בביקור חוזר. לסקריפטים ולגיליונות יש גם הפניות בלי חותמת
# גרסה בחלק מהעמודים, ולכן אין להם מטמון ארוך אלא הגשה מיידית של
# העותק הקיים תוך רענון ברקע: ביקור חוזר מהיר, וטריות בטווח של צפייה
# אחת. קובצי HTML ונתונים נשארים באימות מלא כמו קודם.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"
