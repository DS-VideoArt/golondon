// ===== עדכון meta תגיות לפי קטגוריה (SEO ושיתוף) =====
(function updateMetaForCategory() {
  const canonicalUrl = 'https://golondon.co.il/category.html?cat=' + encodeURIComponent(catKey);
  const fullTitle = cat.title + ' | גו לונדון';
  const desc = cat.desc;

  const canonicalLink = document.querySelector('link[rel="canonical"]');
  if (canonicalLink) canonicalLink.setAttribute('href', canonicalUrl);

  const setMeta = (selector, attr, value) => {
    const el = document.querySelector(selector);
    if (el) el.setAttribute(attr, value);
  };
  setMeta('meta[name="description"]', 'content', desc);
  setMeta('meta[property="og:title"]', 'content', fullTitle);
  setMeta('meta[property="og:description"]', 'content', desc);
  setMeta('meta[property="og:url"]', 'content', canonicalUrl);
  setMeta('meta[name="twitter:title"]', 'content', fullTitle);
  setMeta('meta[name="twitter:description"]', 'content', desc);
})();
document.querySelectorAll('.post-card-img').forEach(el => el.style.setProperty('--hero-grad', cat.grad));

// ===== שליפת פוסטים =====
function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadPosts() {
  let posts = [];
  try {
    const res = await fetch('posts.json?v=' + Date.now());
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data)) posts = data;
    }
  } catch {}
  if (!posts.length) {
    try { posts = JSON.parse(localStorage.getItem('golondon_posts') || '[]'); } catch {}
  }

  const filtered = posts.filter(p => p.category === catKey)
    .sort((a, b) => (a.pinned === b.pinned) ? 0 : a.pinned ? -1 : 1);
  window.__catPosts = filtered;
  const grid = document.getElementById('postsGrid');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('postsCount');

  if (!filtered.length) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    count.textContent = '';
    return;
  }

  count.textContent = `(${filtered.length} פוסטים)`;
  grid.style.display = 'grid';
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(p => {
    const text = p.desc || p.content || '';
    const link = p.url || p.source || '';
    return `
    <div class="post-card" id="post-${p.id}">
      <div class="post-card-img" style="--hero-grad:${cat.grad}">
        ${p.image
          ? `<img src="${escHtml(p.image)}" alt="${escHtml(p.title)}" loading="lazy" width="400" height="220" onerror="this.parentElement.innerHTML='${cat.emoji}'" />`
          : cat.emoji}
      </div>
      <div class="post-card-body">
        <div class="post-card-title">${escHtml(p.title)}</div>
        <div class="post-card-text">${escHtml(text)}</div>
        <div class="post-card-footer">
          <span>${escHtml(p.author || '')}${p.date ? ' · ' + escHtml(p.date) : ''}</span>
          ${link ? `<a href="${escHtml(link)}" target="_blank" rel="noopener"><i class="fab fa-facebook"></i> לפוסט המקורי</a>` : ''}
        </div>
      </div>
    </div>
  `;
  }).join('');

  if (window.location.hash) {
    const target = document.querySelector(window.location.hash);
    if (target) {
      setTimeout(() => {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.style.transition = 'box-shadow 0.4s';
        target.style.boxShadow = '0 0 0 3px #7C3AED';
        setTimeout(() => { target.style.boxShadow = 'none'; }, 2500);
      }, 200);
    }
  }

  wireCategorySearch();
}

/*
  חיפוש בתוך הקטגוריה.
  מסנן את הכרטיסים שכבר מוצגים, בלי טעינה מחדש. החיפוש רץ על הכותרת
  ועל גוף הפוסט, ומציג תמיד כמה תוצאות נמצאו, כדי שלא יהיה מצב
  שהמסך מתרוקן בלי הסבר.
*/
function wireCategorySearch() {
  var input = document.getElementById('catSearch');
  if (!input || input.__wired) return;
  input.__wired = true;

  var clear = document.getElementById('catSearchClear');
  var status = document.getElementById('catSearchStatus');
  var cards = Array.prototype.slice.call(document.querySelectorAll('#postsGrid .post-card'));
  var posts = window.__catPosts || [];

  function apply() {
    var q = (input.value || '').trim().toLowerCase();
    clear.hidden = !q;

    if (!q) {
      cards.forEach(function (c) { c.style.display = ''; });
      status.hidden = true;
      return;
    }

    var shown = 0;
    cards.forEach(function (c, i) {
      var p = posts[i] || {};
      var hay = ((p.title || '') + ' ' + (p.content || p.desc || '')).toLowerCase();
      var hit = hay.indexOf(q) !== -1;
      c.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });

    status.hidden = false;
    status.textContent = shown === 0
      ? 'לא נמצאו פוסטים שמתאימים לחיפוש הזה בקטגוריה. אפשר לנסות חיפוש בכל האתר.'
      : (shown === 1 ? 'נמצא פוסט אחד' : 'נמצאו ' + shown + ' פוסטים');
  }

  input.addEventListener('input', apply);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); apply(); }
  });
  clear.addEventListener('click', function () {
    input.value = '';
    apply();
    input.focus();
  });
}
